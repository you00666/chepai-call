<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#4b60c3"><title>移车二维码</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fb;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}.container{max-width:640px;margin:auto;padding:10px 14px 32px}.header{background:linear-gradient(135deg,#5368cf,#465bc0);color:#fff;text-align:center;padding:22px 14px 20px;border-radius:0 0 16px 16px}.header h1{margin:0;font-size:29px}.header p{margin:7px 0 0;font-size:14px}.card{background:#fff;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:700;margin:3px 0 8px}input{width:100%;height:51px;border:1px solid #d3d7e0;border-radius:10px;padding:0 14px;font-size:18px;outline:none}.field{margin-bottom:16px}.btn{width:100%;min-height:50px;border:0;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}.primary{background:#4b60c3;color:#fff}.secondary{background:#eef1f7;color:#222}.danger{background:#fff;border:1px solid #ddd;color:#555}.logo-row{display:flex;align-items:center;gap:12px;padding:12px;background:#f7f8fb;border-radius:11px}.logo-preview{width:60px;height:60px;border-radius:10px;background:#fff;border:1px dashed #c8ccd6;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.logo-preview img{width:100%;height:100%;object-fit:contain;padding:4px}.logo-empty{font-size:11px;color:#999;text-align:center}.logo-actions{flex:1}.logo-actions input{height:auto;padding:0;border:0;font-size:14px}.logo-name,.logo-tip,.saved,.tip,.footer{font-size:12px;color:#777;line-height:1.6}.logo-name{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.logo-tip{margin-top:5px}#qrBox,#movePage{display:none}.qr-title{margin:0 0 4px;font-size:24px}.qr-plate{font-size:18px;font-weight:700;margin-bottom:8px}.qr-wrap{text-align:center}.qr-frame{display:inline-block;padding:14px;background:#fff;border:1px solid #e2e4ea;border-radius:12px}#qrcode{line-height:0}.url{background:#f5f6f9;border-radius:9px;padding:10px;font-size:12px;color:#666;word-break:break-all;line-height:1.5;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.grid .btn{margin:0}.sticker{margin-top:16px;border:1px solid #ddd;border-radius:14px;padding:18px;text-align:center;background:#fff}.sticker-title{font-size:26px;font-weight:800}.sticker-sub{font-size:16px;margin:7px 0 12px}.sticker-qr{display:inline-block;padding:10px;border:1px solid #eee;border-radius:10px;line-height:0}.sticker-qr img{width:220px;height:220px}.sticker-note{font-size:15px;font-weight:700;margin-top:10px}.footer{text-align:center;margin-top:18px}.move-card{padding:14px 14px 22px}.plate{min-height:78px;display:flex;align-items:center;justify-content:center;background:#4b60c3;color:#fff;border:2px solid #dce2ff;border-radius:9px;box-shadow:0 0 4px #0005;font-size:clamp(34px,9vw,48px);font-weight:600;letter-spacing:2px}.moveTitle{font-size:29px;margin:22px 2px 20px}.notice{font-size:21px;font-weight:600;margin:0 2px 23px}.info{font-size:19px;font-weight:600;line-height:1.8;margin:0 2px 7px}.call{width:100%;height:58px;border:0;border-radius:11px;background:#4b60c3;color:#fff;font-size:21px;font-weight:700;margin-top:15px}.privacy{text-align:center;color:#777;font-size:13px;line-height:1.6;margin-top:13px}.back{text-align:center;margin-top:16px}.back a{color:#4b60c3;text-decoration:none;font-size:14px}@media(max-width:420px){.container{padding:8px 10px 25px}.card{padding:17px;margin-top:12px}.header{padding:20px 12px 18px}.header h1{font-size:27px}.grid{gap:7px}}</style></head><body><div class="container"><section id="generatorPage"><div class="header"><h1>移车二维码</h1><p>输入车牌号和联系电话，生成专属二维码</p></div><div class="card"><div class="field"><label>车牌号</label><input id="plateInput" type="text" value="京A·12345" placeholder="例如：京A·12345" maxlength="12"></div><div class="field"><label>车主联系电话</label><input id="phoneInput" type="tel" placeholder="例如：13800138000" maxlength="20"></div><label>二维码 Logo（可选）</label><div class="logo-row"><div class="logo-preview" id="logoPreview"><div class="logo-empty">未上传<br>Logo</div></div><div class="logo-actions"><input id="logoInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="logo-name" id="logoName">支持 PNG / JPG / WEBP / SVG</div><div class="logo-tip">圆形、方形、圆方形 Logo 均可，自动保持比例并留出白色安全区。</div></div></div><button class="btn primary" onclick="generateQR()">生成移车二维码</button><button class="btn secondary" onclick="restoreSaved()">读取上次信息</button><div class="saved" id="savedText"></div></div><div class="card" id="qrBox"><h2 class="qr-title">专属移车二维码</h2><div class="qr-plate" id="qrPlate"></div><div class="qr-wrap"><div class="qr-frame"><div id="qrcode"></div></div></div><div class="url" id="qrUrl"></div><div class="grid"><button class="btn primary" onclick="downloadQR()">下载二维码</button><button class="btn secondary" onclick="openPreview()">扫码预览</button><button class="btn secondary" onclick="copyUrl()">复制链接</button><button class="btn secondary" onclick="shareUrl()">分享链接</button></div><button class="btn danger" onclick="printSticker()">打印车贴纸</button><div class="sticker"><div class="sticker-title" id="stickerPlate">京A·12345</div><div class="sticker-sub">如需移车，请扫码联系车主</div><div class="sticker-qr"><div id="stickerQR"></div></div><div class="sticker-note">📞 一键呼叫车主</div></div><div class="tip">Logo 自动放到二维码中央；采用高容错等级并保留白色安全区，兼顾美观和识别率。</div></div><div class="footer">移车二维码 · 信息仅用于联系车主</div></section><section id="movePage"><div class="card move-card"><div class="plate" id="movePlate"></div><h1 class="moveTitle">挪车信息</h1><div class="notice">临时停靠，请多关照</div><div class="info" id="movePlateInfo"></div><div class="info">联系电话：点击下方按钮联系车主</div><button class="call" id="callBtn">📞 一键呼叫车主</button><div class="privacy">为保护车主隐私，页面不直接显示完整电话号码。</div><div class="back"><a href="./">返回二维码生成器</a></div></div></section></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const BASE_URL=location.origin+location.pathname;let logoData="";function getParams(){const p=new URLSearchParams(location.search);return{plate:p.get("plate")||"",phone:p.get("phone")||""}}function cleanPlate(v){return v.trim().replace(/\s+/g," ").toUpperCase()}function makeUrl(p,n){return BASE_URL+"?plate="+encodeURIComponent(p)+"&phone="+encodeURIComponent(n)}function validPhone(n){return/^[0-9+()\-\s]{6,20}$/.test(n)}document.getElementById("logoInput").addEventListener("change",function(e){const f=e.target.files[0];if(!f)return;if(f.size>2*1024*1024){alert("Logo 文件建议不超过 2MB");e.target.value="";return}const r=new FileReader();r.onload=function(){logoData=r.result;try{localStorage.setItem("moveLogo",logoData)}catch(e){}document.getElementById("logoPreview").innerHTML='<img src="'+logoData+'">';document.getElementById("logoName").textContent=f.name};r.readAsDataURL(f)});async function buildQR(c,size){const o=document.createElement("canvas");o.width=o.height=size;const x=o.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(c,0,0,size,size);if(!logoData)return o;await new Promise(done=>{const i=new Image();i.onload=function(){const max=size*.18,s=Math.min(max/i.width,max/i.height),w=i.width*s,h=i.height*s,px=(size-w)/2,py=(size-h)/2,pad=Math.max(10,size*.025);x.fillStyle="#fff";if(x.roundRect){x.beginPath();x.roundRect(px-pad,py-pad,w+pad*2,h+pad*2,Math.min(24,pad*1.4));x.fill()}else x.fillRect(px-pad,py-pad,w+pad*2,h+pad*2);x.drawImage(i,px,py,w,h);done()};i.onerror=done;i.src=logoData});return o}async function generateQR(){const p=cleanPlate(document.getElementById("plateInput").value),n=document.getElementById("phoneInput").value.trim();if(!p){alert("请输入车牌号");return}if(!n||!validPhone(n)){alert("请输入正确的联系电话");return}try{localStorage.setItem("movePlate",p);localStorage.setItem("movePhone",n)}catch(e){}const u=makeUrl(p,n);document.getElementById("qrcode").innerHTML="";new QRCode(document.getElementById("qrcode"),{text:u,width:280,height:280,correctLevel:QRCode.CorrectLevel.H});document.getElementById("qrPlate").textContent=p;document.getElementById("qrUrl").textContent=u;document.getElementById("stickerPlate").textContent=p;document.getElementById("savedText").textContent="已自动保存本机填写的信息";document.getElementById("qrBox").style.display="block";setTimeout(renderSticker,100);document.getElementById("qrBox").scrollIntoView({behavior:"smooth",block:"start"})}async function renderSticker(){const c=document.querySelector("#qrcode canvas");if(!c)return;const o=await buildQR(c,700),i=new Image();i.onload=function(){document.getElementById("stickerQR").innerHTML="";i.width=220;i.height=220;document.getElementById("stickerQR").appendChild(i)};i.src=o.toDataURL("image/png")}function restoreSaved(){const p=localStorage.getItem("movePlate"),n=localStorage.getItem("movePhone"),l=localStorage.getItem("moveLogo");if(p)document.getElementById("plateInput").value=p;if(n)document.getElementById("phoneInput").value=n;if(l){logoData=l;document.getElementById("logoPreview").innerHTML='<img src="'+l+'">';document.getElementById("logoName").textContent="已读取上次 Logo"}if(p||n||l)document.getElementById("savedText").textContent="已读取上次保存的信息";else alert("本机还没有保存过信息")}async function downloadQR(){const c=document.querySelector("#qrcode canvas");if(!c){alert("请先生成二维码");return}const o=await buildQR(c,1000),a=document.createElement("a"),p=document.getElementById("plateInput").value.trim()||"移车";a.href=o.toDataURL("image/png");a.download=p+"_移车二维码.png";a.click()}function openPreview(){const p=cleanPlate(document.getElementById("plateInput").value),n=document.getElementById("phoneInput").value.trim();if(!p||!n){alert("请先填写车牌号和联系电话");return}window.open(makeUrl(p,n),"_blank")}async function copyUrl(){const u=document.getElementById("qrUrl").textContent;if(!u){alert("请先生成二维码");return}try{await navigator.clipboard.writeText(u);alert("链接已复制")}catch(e){prompt("请复制下面的链接：",u)}}async function shareUrl(){const u=document.getElementById("qrUrl").textContent;if(!u){alert("请先生成二维码");return}if(navigator.share){try{await navigator.share({title:"移车二维码",text:"我的移车二维码",url:u})}catch(e){}}else copyUrl()}async function printSticker(){const c=document.querySelector("#qrcode canvas");if(!c){alert("请先生成二维码");return}const p=cleanPlate(document.getElementById("plateInput").value),o=await buildQR(c,1000),d=o.toDataURL("image/png"),w=window.open("","_blank");if(!w){alert("浏览器阻止了新窗口，请允许弹出窗口后再试");return}w.document.write('<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>移车车贴纸</title><style>body{margin:0;background:#eee;font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center}.sheet{width:90mm;padding:8mm;margin:10mm auto;background:#fff;border:1px solid #ccc;border-radius:5mm}.plate{font-size:28pt;font-weight:800}.sub{font-size:14pt;margin:4mm 0}.qr{width:65mm;height:65mm;object-fit:contain}.note{font-size:14pt;font-weight:700;margin-top:4mm}.small{font-size:9pt;color:#777;margin-top:3mm}@media print{body{background:#fff}.sheet{margin:0;border:0;border-radius:0}}</style></head><body><div class="sheet"><div class="plate">'+p+'</div><div class="sub">如需移车，请扫码联系车主</div><img class="qr" src="'+d+'"><div class="note">📞 一键呼叫车主</div><div class="small">请勿遮挡二维码</div></div><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>');w.document.close()}function showMove(p,n){document.getElementById("generatorPage").style.display="none";document.getElementById("movePage").style.display="block";document.getElementById("movePlate").textContent=p;document.getElementById("movePlateInfo").textContent="车牌号："+p;document.getElementById("callBtn").onclick=function(){location.href="tel:"+n.replace(/[^0-9+]/g,"")}}window.addEventListener("DOMContentLoaded",function(){const x=getParams();if(x.plate&&x.phone)showMove(x.plate,x.phone);else{document.getElementById("generatorPage").style.display="block";if(localStorage.getItem("movePlate")||localStorage.getItem("movePhone"))document.getElementById("savedText").textContent="本机有上次保存的信息"}});</script></body></html>
