<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>移车通知</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #fff;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
  }
  .wrap {
    padding: 10px 16px 40px;
  }
  .plate {
    width: 100%;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #4b60c3;
    color: #fff;
    border: 2px solid #dce2ff;
    border-radius: 9px;
    box-shadow: 0 0 4px rgba(0,0,0,.35);
    font-size: clamp(34px, 9vw, 48px);
    font-weight: 600;
    letter-spacing: 2px;
  }
  h1 {
    margin: 20px 0 22px;
    font-size: 30px;
    line-height: 1.2;
  }
  .notice {
    font-size: 25px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .info {
    font-size: 23px;
    font-weight: 600;
    line-height: 1.8;
    margin: 0 0 12px;
  }
  .call-btn {
    margin-top: 10px;
    min-width: 165px;
    min-height: 58px;
    padding: 12px 24px;
    border: 1px solid #888;
    border-radius: 10px;
    background: #f7f7f7;
    color: #111;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .call-btn:active {
    transform: scale(.98);
    background: #e9e9e9;
  }
  .hint {
    margin-top: 18px;
    color: #777;
    font-size: 14px;
  }
  @media (max-width: 480px) {
    .wrap { padding: 8px 14px 32px; }
    .plate { min-height: 72px; font-size: 34px; }
    h1 { font-size: 28px; margin-top: 18px; }
    .notice { font-size: 22px; }
    .info { font-size: 20px; }
    .call-btn { width: 100%; font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="plate" id="plate">京A·12345</div>

  <h1>挪车信息</h1>

  <div class="notice">临时停靠，请多关照</div>

  <div class="info" id="plateInfo">车牌号：京A·12345</div>
  <div class="info" id="phoneInfo">联系电话：未设置</div>

  <button class="call-btn" id="callBtn">一键呼叫</button>
  <div class="hint" id="hint"></div>
</div>

<script>
(function () {
  // 支持通过网址参数设置车牌和手机号：
  // 例如：index.html?plate=京A·12345&phone=13800138000
  const params = new URLSearchParams(location.search);
  const plate = params.get("plate") || "京A·12345";
  const phone = params.get("phone") || "";

  document.getElementById("plate").textContent = plate;
  document.getElementById("plateInfo").textContent = "车牌号：" + plate;

  const phoneInfo = document.getElementById("phoneInfo");
  const callBtn = document.getElementById("callBtn");
  const hint = document.getElementById("hint");

  if (phone) {
    phoneInfo.textContent = "联系电话：" + phone;
    callBtn.addEventListener("click", function () {
      window.location.href = "tel:" + phone.replace(/[^\d+]/g, "");
    });
  } else {
    phoneInfo.textContent = "联系电话：未设置";
    callBtn.addEventListener("click", function () {
      alert("暂未设置车主联系电话");
    });
    hint.textContent = "请在二维码链接中加入 phone 参数，即可启用一键呼叫。";
  }
})();
</script>
</body>
</html>
