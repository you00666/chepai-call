<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#4b60c3">
<title>移车二维码</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6fb;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.container{width:100%;max-width:640px;margin:auto;padding:10px 14px 30px}
.header{background:linear-gradient(135deg,#5368cf,#465bc0);color:#fff;text-align:center;padding:22px 14px 20px;border-radius:0 0 16px 16px;box-shadow:0 5px 16px #4358bb33}
.header h1{margin:0;font-size:29px}.header p{margin:7px 0 0;font-size:14px;opacity:.94}
.card{background:#fff;border-radius:16px;padding:20px;margin-top:16px;box-shadow:0 4px 18px #0000000d}
label{display:block;font-weight:700;font-size:16px;margin:3px 0 8px}
input{width:100%;height:51px;border:1px solid #d3d7e0;border-radius:10px;padding:0 14px;font-size:18px;outline:none;background:#fff}
input:focus{border-color:#4b60c3;box-shadow:0 0 0 3px #4b60c31a}
.field{margin-bottom:16px}
.btn{width:100%;min-height:50px;border:0;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
.primary{background:#4b60c3;color:#fff}.secondary{background:#eef1f7;color:#222}
.btn:active{transform:scale(.985)}
#qrBox,#movePage{display:none}
.qr-title{margin:0 0 4px;font-size:24px}
.qr-plate{font-size:18px;font-weight:700;margin-bottom:8px}
.qr-wrap{text-align:center}
#qrcode{display:inline-flex;padding:14px;background:#fff;border:1px solid #e2e4ea;border-radius:12px;margin:5px auto 10px}
.url{background:#f5f6f9;border-radius:9px;padding:10px;font-size:12px;color:#666;word-break:break-all;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.grid .btn{margin:0}
.tip{font-size:13px;color:#777;line-height:1.65;margin-top:13px}
.saved{font-size:13px;color:#68707e;margin-top:8px}
.danger{color:#666;background:#fff;border:1px solid #ddd}
.footer{text-align:center;color:#999;font-size:12px;margin-top:18px}

/* 扫码页面 */
.move-card{padding:14px 14px 22px}
.plate{min-height:78px;display:flex;align-items:center;justify-content:center;background:#4b60c3;color:#fff;border:2px solid #dce2ff;border-radius:9px;box-shadow:0 0 4px #00000055;font-size:clamp(34px,9vw,48px);font-weight:600;letter-spacing:2px}
.moveTitle{font-size:29px;margin:22px 2px 20px}
.notice{font-size:21px;font-weight:600;margin:0 2px 23px}
.info{font-size:19px;font-weight:600;line-height:1.8;margin:0 2px 7px}
.call{width:100%;height:58px;border:0;border-radius:11px;background:#4b60c3;color:#fff;font-size:21px;font-weight:700;margin-top:15px;box-shadow:0 5px 12px #4b60c333}
.privacy{text-align:center;color:#777;font-size:13px;line-height:1.6;margin-top:13px}
.back{text-align:center;margin-top:16px}.back a{color:#4b60c3;text-decoration:none;font-size:14px}
@media(max-width:420px){.container{padding:8px 10px 25px}.card{padding:17px;margin-top:12px}.header{padding:20px 12px 18px}.header h1{font-size:27px}.grid{gap:7px}}
@media print{
 body{background:#fff}.header,#generatorPage,.footer,.back,.privacy{display:none!important}
 #movePage{display:block!important}.move-card{box-shadow:none}
}
</style>
</head>
<body>
<div class="container">

<section id="generatorPage">
  <div class="header">
    <h1>移车二维码</h1>
    <p>输入车牌号和联系电话，生成专属二维码</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="plateInput">车牌号</label>
      <input id="plateInput" type="text" value="京A·12345" placeholder="例如：京A·12345" maxlength="12" autocomplete="off">
    </div>
    <div class="field">
      <label for="phoneInput">车主联系电话</label>
      <input id="phoneInput" type="tel" placeholder="例如：13800138000" maxlength="20" autocomplete="tel">
    </div>

    <button class="btn primary" onclick="generateQR()">生成移车二维码</button>
    <button class="btn secondary" onclick="restoreSaved()">读取上次信息</button>
    <div class="saved" id="savedText"></div>
  </div>

  <div class="card" id="qrBox">
    <h2 class="qr-title">专属移车二维码</h2>
    <div class="qr-plate" id="qrPlate"></div>
    <div class="qr-wrap"><div id="qrcode"></div></div>
    <div class="url" id="qrUrl"></div>

    <div class="grid">
      <button class="btn primary" onclick="downloadQR()">下载二维码</button>
      <button class="btn secondary" onclick="openPreview()">扫码预览</button>
      <button class="btn secondary" onclick="copyUrl()">复制链接</button>
      <button class="btn secondary" onclick="shareUrl()">分享链接</button>
    </div>
    <button class="btn danger" onclick="printQR()">打印二维码</button>

    <div class="tip">
      建议将二维码打印后贴在车内明显位置。扫码者无需看到完整手机号，
      点击“一键呼叫车主”即可联系车主。
    </div>
  </div>
  <div class="footer">移车二维码 · 信息仅用于联系车主</div>
</section>

<section id="movePage">
  <div class="card move-card">
    <div class="plate" id="movePlate"></div>
    <h1 class="moveTitle">挪车信息</h1>
    <div class="notice">临时停靠，请多关照!</div>
    <div class="info" id="movePlateInfo"></div>
    <div class="info">联系电话：点击下方按钮联系车主</div>
    <button class="call" id="callBtn">📞 一键呼叫车主</button>
    <div class="privacy">为保护车主隐私，页面不直接显示完整电话号码。</div>
    <div class="back"><a href="./">返回二维码生成器</a></div>
  </div>
</section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const BASE_URL=location.origin+location.pathname;

function getParams(){
  const p=new URLSearchParams(location.search);
  return {plate:p.get("plate")||"",phone:p.get("phone")||""};
}
function cleanPlate(v){
  return v.trim().replace(/·/g,"·").replace(/\s+/g," ").toUpperCase();
}
function makeUrl(plate,phone){
  return BASE_URL+"?plate="+encodeURIComponent(plate)+"&phone="+encodeURIComponent(phone);
}
function validPhone(phone){
  return /^[0-9+()\\-\\s]{6,20}$/.test(phone);
}
function generateQR(){
  const plate=cleanPlate(document.getElementById("plateInput").value);
  const phone=document.getElementById("phoneInput").value.trim();
  if(!plate){alert("请输入车牌号");return}
  if(!phone||!validPhone(phone)){alert("请输入正确的联系电话");return}

  localStorage.setItem("movePlate",plate);
  localStorage.setItem("movePhone",phone);
  document.getElementById("savedText").textContent="已自动保存本机填写的信息";

  const url=makeUrl(plate,phone);
  document.getElementById("qrcode").innerHTML="";
  new QRCode(document.getElementById("qrcode"),{
    text:url,width:260,height:260,correctLevel:QRCode.CorrectLevel.M
  });
  document.getElementById("qrPlate").textContent=plate;
  document.getElementById("qrUrl").textContent=url;
  document.getElementById("qrBox").style.display="block";
  document.getElementById("qrBox").scrollIntoView({behavior:"smooth",block:"start"});
}
function restoreSaved(){
  const plate=localStorage.getItem("movePlate");
  const phone=localStorage.getItem("movePhone");
  if(!plate&&!phone){alert("本机还没有保存过信息");return}
  if(plate)document.getElementById("plateInput").value=plate;
  if(phone)document.getElementById("phoneInput").value=phone;
  document.getElementById("savedText").textContent="已读取上次保存的信息";
}
function downloadQR(){
  const canvas=document.querySelector("#qrcode canvas");
  const img=document.querySelector("#qrcode img");
  const data=canvas?canvas.toDataURL("image/png"):(img?img.src:"");
  if(!data){alert("请先生成二维码");return}
  const plate=document.getElementById("plateInput").value.trim()||"移车";
  const a=document.createElement("a");
  a.href=data;a.download=plate.replace(/[\\\\/:*?"<>|]/g,"_")+"_移车二维码.png";a.click();
}
function openPreview(){
  const plate=cleanPlate(document.getElementById("plateInput").value);
  const phone=document.getElementById("phoneInput").value.trim();
  if(!plate||!phone){alert("请先填写车牌号和联系电话");return}
  window.open(makeUrl(plate,phone),"_blank");
}
async function copyUrl(){
  const url=document.getElementById("qrUrl").textContent;
  if(!url){alert("请先生成二维码");return}
  try{await navigator.clipboard.writeText(url);alert("链接已复制")}
  catch(e){prompt("请复制下面的链接：",url)}
}
async function shareUrl(){
  const url=document.getElementById("qrUrl").textContent;
  if(!url){alert("请先生成二维码");return}
  if(navigator.share){
    try{await navigator.share({title:"移车二维码",text:"我的移车二维码",url})}catch(e){}
  }else{
    copyUrl();
  }
}
function printQR(){
  if(!document.querySelector("#qrcode canvas")&&!document.querySelector("#qrcode img")){alert("请先生成二维码");return}
  window.print();
}
function showMove(plate,phone){
  document.getElementById("generatorPage").style.display="none";
  document.getElementById("movePage").style.display="block";
  document.getElementById("movePlate").textContent=plate;
  document.getElementById("movePlateInfo").textContent="车牌号："+plate;
  document.getElementById("callBtn").onclick=function(){
    location.href="tel:"+phone.replace(/[^0-9+]/g,"");
  };
}
window.addEventListener("DOMContentLoaded",function(){
  const x=getParams();
  if(x.plate&&x.phone)showMove(x.plate,x.phone);
  else{
    document.getElementById("generatorPage").style.display="block";
    if(localStorage.getItem("movePlate")||localStorage.getItem("movePhone"))
      document.getElementById("savedText").textContent="本机有上次保存的信息";
  }
});
</script>
</body>
</html>
